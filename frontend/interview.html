<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live AI Interview Room — InterviewAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/interview.css">
  <style>
    /* In-page overrides for smooth ChatGPT conversational interaction */
    .chat-typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 12px 18px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 0 16px 16px 16px;
      box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.05);
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: #818CF8;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .chat-complete-card {
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
      border: 1.5px solid #818CF8;
      border-radius: 16px;
      padding: 28px 32px;
      text-align: center;
      margin: 20px auto;
      max-width: 780px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body>

  <div class="chat-page-layout">
    
    <!-- 1. Dark Navy Sidebar -->
    <aside class="chat-sidebar" id="chat-sidebar">
      <div>
        <div class="chat-sidebar-header">
          <div class="chat-brand">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>InterviewAI</span>
          </div>
          <span class="chat-badge-pro">PRO</span>
        </div>

        <!-- Session Meta Card -->
        <div class="chat-session-info">
          <div class="chat-session-role" id="session-role">Senior Software Engineer</div>
          <div class="chat-session-meta">
            <span class="chat-meta-chip active" id="session-type-chip">Technical</span>
            <span class="chat-meta-chip" id="session-diff-chip">Medium</span>
            <span class="chat-meta-chip" id="session-qcount-chip">5 Questions</span>
          </div>
        </div>

        <!-- Sidebar Navigation Actions -->
        <div class="chat-sidebar-nav">
          <div class="chat-sidebar-section-title">Interview Controls</div>
          
          <button type="button" class="chat-sidebar-btn" id="sidebar-hint-btn">
            <span>💡</span>
            <span>Ask for Question Hint</span>
          </button>

          <button type="button" class="chat-sidebar-btn" id="sidebar-skip-btn">
            <span>⏭️</span>
            <span>Skip / Pass Question</span>
          </button>

          <div class="chat-sidebar-section-title" style="margin-top:16px;">Navigation</div>

          <a href="dashboard.html" class="chat-sidebar-btn">
            <span>📊</span>
            <span>Dashboard</span>
          </a>

          <a href="interview-config.html" class="chat-sidebar-btn">
            <span>🚀</span>
            <span>Standard Mock Practice</span>
          </a>

          <a href="adaptive-interview.html" class="chat-sidebar-btn" style="color:#60A5FA;">
            <span>🧠</span>
            <span>Adaptive AI Interview</span>
          </a>

          <a href="history.html" class="chat-sidebar-btn">
            <span>📜</span>
            <span>Session History</span>
          </a>

          <button type="button" class="chat-sidebar-btn danger" id="sidebar-end-btn" style="margin-top:20px;">
            <span>⏹️</span>
            <span>End Interview Now</span>
          </button>
        </div>
      </div>

      <!-- Sidebar Footer -->
      <div class="chat-sidebar-footer">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="chat-avatar user" id="sidebar-user-avatar" style="width:34px; height:34px; font-size:0.85rem;">U</div>
          <div>
            <div style="font-size:0.82rem; font-weight:700; color:#FFFFFF;" id="sidebar-user-name">Candidate</div>
            <div style="font-size:0.72rem; color:#64748B;">Active Session</div>
          </div>
        </div>
        <button onclick="API.removeToken(); window.location.href='login.html';" style="background:none; border:none; color:#64748B; cursor:pointer; font-size:1.1rem;" title="Logout">🚪</button>
      </div>
    </aside>

    <!-- 2. Main Chat Workspace -->
    <main class="chat-main">
      
      <!-- Sticky Topbar -->
      <header class="chat-topbar">
        <div class="chat-topbar-left">
          <button type="button" class="chat-toggle-sidebar" id="mobile-toggle-btn" aria-label="Toggle Sidebar">
            ☰
          </button>
          <div class="chat-topbar-title">
            <span id="topbar-role-title">Technical Mock Interview</span>
            <span style="font-size:0.75rem; background:#DCFCE7; color:#15803D; padding:2px 8px; border-radius:9999px; font-weight:700; display:inline-flex; align-items:center; gap:4px;">
              <span style="width:6px; height:6px; background:#16A34A; border-radius:50%;"></span>
              Gemini 3.8 Flash Online
            </span>
          </div>
        </div>

        <div class="chat-progress-wrap">
          <div class="chat-progress-label" id="chat-progress-text">QUESTION 1 OF 5</div>
          <div class="chat-progress-track">
            <div class="chat-progress-bar" id="chat-progress-bar" style="width: 20%;"></div>
          </div>
          <div class="chat-timer-badge">
            <span>⏱️</span>
            <span id="chat-timer-display">20:00</span>
          </div>
        </div>
      </header>

      <!-- Chronological Scrollable Message Feed -->
      <div class="chat-feed" id="chat-feed">
        <!-- Messages are dynamically injected by js/interview.js -->
      </div>

      <!-- Persistent Floating Composer -->
      <div class="chat-composer-container">
        <div class="chat-composer-card" id="chat-composer-card">
          <textarea 
            id="chat-input" 
            class="chat-textarea" 
            placeholder="Type your answer here... Be specific with architecture decisions, trade-offs, and code logic. (Ctrl+Enter to submit)"
            rows="2"
          ></textarea>

          <div class="chat-composer-toolbar">
            <div class="chat-composer-tools-left">
              <span class="chat-word-count" id="chat-word-count">0 words</span>
              <button type="button" class="chat-action-btn" id="btn-request-hint" title="Ask interviewer for guidance without penalty">
                <span>💡</span>
                <span>Ask for Hint</span>
              </button>
              <button type="button" class="chat-action-btn" id="btn-clear-input" title="Clear text">
                <span>🧹</span>
                <span>Clear</span>
              </button>
            </div>

            <button type="button" class="chat-submit-btn" id="btn-submit-answer">
              <span>Submit Answer (Ctrl+↵)</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>

    </main>

  </div>

  <script src="js/api.js"></script>
  <script src="js/interview.js"></script>
</body>
</html>
